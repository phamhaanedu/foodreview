    <meta property="og:type" content="website" />
    <meta property="og:title" content="FoodReview - Cộng đồng Ẩm thực" />
    <meta property="og:description" content="Khám phá và chia sẻ đánh giá về những địa điểm ăn uống tuyệt vời nhất cùng FoodReview." />

    <script type="text/javascript">
      // Chuyển đổi đường dẫn URL thành dạng query string để tránh mất data khi reload trang trên Github Pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
